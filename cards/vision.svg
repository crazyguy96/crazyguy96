<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 160" role="img" aria-labelledby="title-vision">
  <title id="title-vision">Self-Supervised Vision Transformers</title>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  </style>

  <!-- Card Surface and Hairline -->
  <rect x="0.5" y="0.5" width="449" height="159" rx="12" fill="#16171a" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

  <!-- Left Content -->
  <g transform="translate(28, 30)">
    <text x="0" y="0" class="mono" font-size="12" font-weight="400" fill="#818cf8">Galaxy vision</text>
    <text x="0" y="30" class="sans" font-size="20" font-weight="500" fill="#ededed" letter-spacing="-0.3">Vision Transformers</text>
    <text x="0" y="54" class="sans" font-size="13.5" font-weight="400" fill="#a1a1a6">DINOv2 on DESI galaxy surveys</text>
    <text x="0" y="82" class="mono" font-size="11.5" font-weight="400" fill="#737373">Self-attention probing · CIFAR-10</text>
  </g>

  <!-- Right Visual Moment: Clean Galaxy Representation -->
  <g transform="translate(298, 24)">
    <rect x="0" y="0" width="124" height="112" rx="8" fill="#1b1c20" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
    
    <!-- Galaxy Core Ellipse -->
    <ellipse cx="62" cy="54" rx="42" ry="20" transform="rotate(-28 62 54)" fill="#23263b" fill-opacity="0.8"/>
    <ellipse cx="62" cy="54" rx="26" ry="11" transform="rotate(-28 62 54)" fill="#313654" fill-opacity="0.9"/>
    <circle cx="62" cy="54" r="3" fill="#e0e7ff"/>

    <!-- Subtle Astronomical Spiral Arm Lines -->
    <path d="M 32 64 C 44 42, 78 36, 92 48 C 100 56, 88 74, 62 70 C 48 66, 44 48, 58 42" 
          fill="none" stroke="#818cf8" stroke-width="1" stroke-opacity="0.6"/>

    <!-- Stars -->
    <circle cx="28" cy="36" r="1" fill="#ededed" opacity="0.6"/>
    <circle cx="94" cy="32" r="1.2" fill="#ededed" opacity="0.7"/>
    <circle cx="86" cy="82" r="0.8" fill="#ededed" opacity="0.5"/>
    <circle cx="36" cy="78" r="1" fill="#ededed" opacity="0.5"/>
    <circle cx="78" cy="24" r="0.8" fill="#ededed" opacity="0.4"/>

    <!-- Single ViT Attention Patch Box -->
    <rect x="52" y="44" width="20" height="20" fill="none" stroke="#818cf8" stroke-width="1.2" stroke-dasharray="2 2"/>
    <text x="14" y="100" class="mono" font-size="8.5" fill="#737373">ViT patch tokens [14×14]</text>
  </g>
</svg>
