<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 160" role="img" aria-labelledby="title-delay">
  <title id="title-delay">Land Acquisition Delay Prediction</title>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  </style>

  <!-- Card Surface and Hairline -->
  <rect x="0.5" y="0.5" width="449" height="159" rx="12" fill="#16171a" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

  <!-- Left Content -->
  <g transform="translate(28, 30)">
    <text x="0" y="0" class="mono" font-size="12" font-weight="400" fill="#eab308">Risk prediction</text>
    <text x="0" y="30" class="sans" font-size="20" font-weight="500" fill="#ededed" letter-spacing="-0.3">Land Delay Prediction</text>
    <text x="0" y="54" class="sans" font-size="13.5" font-weight="400" fill="#a1a1a6">Risk scores and SHAP attribution</text>
    <text x="0" y="82" class="mono" font-size="11.5" font-weight="400" fill="#737373">LightGBM · XGBoost · SHAP</text>
  </g>

  <!-- Right Visual Moment: SHAP Feature Importance Bars -->
  <g transform="translate(298, 24)">
    <rect x="0" y="0" width="124" height="112" rx="8" fill="#1b1c20" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
    
    <!-- Title -->
    <text x="14" y="22" class="mono" font-size="9" fill="#737373">Feature impact</text>

    <!-- Feature 1: Positive impact -->
    <text x="14" y="44" class="mono" font-size="8.5" fill="#a1a1a6">Dispute</text>
    <rect x="52" y="37" width="46" height="7" rx="2" fill="#eab308"/>

    <!-- Feature 2: High impact -->
    <text x="14" y="62" class="mono" font-size="8.5" fill="#a1a1a6">Clearance</text>
    <rect x="52" y="55" width="58" height="7" rx="2" fill="#eab308" fill-opacity="0.8"/>

    <!-- Feature 3: Negative impact -->
    <text x="14" y="80" class="mono" font-size="8.5" fill="#a1a1a6">Budget</text>
    <rect x="52" y="73" width="28" height="7" rx="2" fill="#475569"/>

    <!-- Divider baseline -->
    <line x1="52" y1="32" x2="52" y2="86" stroke="#333742" stroke-width="1"/>

    <!-- Baseline score -->
    <text x="14" y="100" class="mono" font-size="8.5" fill="#737373">SHAP value φ</text>
  </g>
</svg>
