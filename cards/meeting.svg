<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 160" role="img" aria-labelledby="title-meeting">
  <title id="title-meeting">AI Meeting Assistant</title>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  </style>

  <!-- Card Surface and Hairline -->
  <rect x="0.5" y="0.5" width="449" height="159" rx="12" fill="#16171a" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

  <!-- Left Content -->
  <g transform="translate(28, 30)">
    <text x="0" y="0" class="mono" font-size="12" font-weight="400" fill="#3eb4a2">Speech pipeline</text>
    <text x="0" y="30" class="sans" font-size="20" font-weight="500" fill="#ededed" letter-spacing="-0.3">AI Meeting Assistant</text>
    <text x="0" y="54" class="sans" font-size="13.5" font-weight="400" fill="#a1a1a6">Audio to action items</text>
    <text x="0" y="82" class="mono" font-size="11.5" font-weight="400" fill="#737373">Faster-Whisper · Evidence check</text>
  </g>

  <!-- Right Visual Moment: Waveform and Transcript Verification -->
  <g transform="translate(298, 24)">
    <rect x="0" y="0" width="124" height="112" rx="8" fill="#1b1c20" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
    
    <!-- Audio Waveform trace -->
    <path d="M 16 36 h 10 l 4 -8 l 6 16 l 7 -22 l 7 28 l 8 -18 l 6 12 l 8 -8 h 22" 
          fill="none" stroke="#3eb4a2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Text Transcript Lines -->
    <line x1="16" y1="58" x2="84" y2="58" stroke="#333742" stroke-width="2" stroke-linecap="round"/>
    <line x1="16" y1="68" x2="68" y2="68" stroke="#2c2f38" stroke-width="2" stroke-linecap="round"/>

    <!-- Verification Checkbox -->
    <rect x="16" y="82" width="12" height="12" rx="3" fill="#152422" stroke="#3eb4a2" stroke-width="1"/>
    <path d="m 19 88 l 2.5 2.5 l 4.5 -5" fill="none" stroke="#3eb4a2" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="34" y="92" class="mono" font-size="9" fill="#a1a1a6">Action items</text>
  </g>
</svg>
