<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 200" role="img" aria-labelledby="hero-title">
  <title id="hero-title">Jatin Mehra — Data Science &amp; AI · IIT Guwahati</title>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  </style>

  <!-- Surface and quiet hairline -->
  <rect x="0.5" y="0.5" width="919" height="199" rx="16" fill="#16171a" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

  <!-- Left Content -->
  <g transform="translate(48, 44)">
    <text x="0" y="0" class="mono" font-size="13" font-weight="400" fill="#a1a1a6">IIT Guwahati · Data Science &amp; Artificial Intelligence</text>
    <text x="0" y="44" class="sans" font-size="40" font-weight="500" fill="#ededed" letter-spacing="-0.5">Jatin Mehra</text>
    <text x="0" y="80" class="sans" font-size="15" font-weight="400" fill="#a1a1a6">Machine learning for messy, real-world inputs</text>
    <text x="0" y="108" class="sans" font-size="13" font-weight="400" fill="#737373">Speech · Self-supervised vision · Explainable ML · Worker tools</text>
  </g>

  <!-- Right Visual Moment: Calm acoustic signal trace -->
  <g transform="translate(620, 48)">
    <rect x="0" y="0" width="252" height="104" rx="10" fill="#1b1c20" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
    
    <!-- Coordinate reference hairlines -->
    <line x1="16" y1="52" x2="236" y2="52" stroke="#26282f" stroke-width="1"/>
    <line x1="16" y1="26" x2="236" y2="26" stroke="#22232a" stroke-width="0.75" stroke-dasharray="2 4"/>
    <line x1="16" y1="78" x2="236" y2="78" stroke="#22232a" stroke-width="0.75" stroke-dasharray="2 4"/>

    <!-- Acoustic signal envelope -->
    <path d="M 20 52 C 32 46, 40 58, 52 52 C 64 36, 72 68, 84 52 C 96 22, 104 82, 116 52 C 128 32, 136 72, 148 52 C 160 40, 168 64, 180 52 C 192 48, 204 56, 216 52 C 224 50, 228 52, 232 52" 
          fill="none" stroke="#333742" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Single accent waveform: the moment -->
    <path d="M 40 52 C 54 38, 62 66, 76 52 C 90 26, 98 78, 112 52 C 126 34, 134 70, 148 52 C 162 42, 172 62, 186 52" 
          fill="none" stroke="#3eb4a2" stroke-width="1.8" stroke-linecap="round"/>

    <text x="16" y="94" class="mono" font-size="10" fill="#737373">signal f(t) · 16 kHz</text>
    <text x="236" y="94" text-anchor="end" class="mono" font-size="10" fill="#737373">dB/Hz</text>
  </g>
</svg>
