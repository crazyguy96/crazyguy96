<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 270" role="img" aria-labelledby="title">
<title id="title">Jatin Mehra — Data Science &amp; AI · IIT Guwahati</title>

<defs>
  <linearGradient id="background" x2="1" y2="1" gradientUnits="objectBoundingBox">
    <stop stop-color="#101a32"/><stop offset="1" stop-color="#0c1222"/>
  </linearGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M24 0H0v24" fill="none" stroke="#7495c9" stroke-opacity=".15"/>
  </pattern>
  <linearGradient id="fade"><stop stop-color="white" stop-opacity="0"/><stop offset="1" stop-color="white"/></linearGradient>
  <mask id="grid-mask"><path d="M480 0h440v270H480z" fill="url(#fade)"/></mask>
  <clipPath id="frame"><rect width="920" height="270" rx="24"/></clipPath>
  <linearGradient id="signal"><stop stop-color="#63dbc7"/><stop offset="1" stop-color="#a494fc"/></linearGradient>
  <path id="wave" pathLength="100" d="M0 0h22l9-12 10 24 11-35 12 46 14-62 12 78 15-100 14 112 14-82 13 58 14-38 12 18h20"/>
</defs>
<style>
  .pulse { stroke-dasharray: 7 120; animation: sweep 4s linear infinite; }
  @keyframes sweep { from { stroke-dashoffset: 7; } to { stroke-dashoffset: -100; } }
  @media (prefers-reduced-motion: reduce) { .pulse { display: none; } }
</style>
<g clip-path="url(#frame)">
  <rect width="920" height="270" fill="url(#background)"/>
  <rect width="920" height="270" fill="url(#grid)" mask="url(#grid-mask)"/>
  <path d="M44 46h52" stroke="#64e1cf" stroke-width="3" stroke-linecap="round"/>
  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif">
    <text x="44" y="137" fill="#f5f8ff" font-size="82" font-weight="750" letter-spacing="-3">Jatin Mehra</text>
    <text x="48" y="190" fill="#b8c9e4" font-size="32" font-weight="550">Data Science &amp; AI · IIT Guwahati</text>
  </g>
  <g transform="translate(645 134) scale(1.07)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 0h210" stroke="#7282ad" stroke-opacity=".40"/>
    <use href="#wave" stroke="url(#signal)" stroke-width="3"/>
    <use href="#wave" class="pulse" stroke="#e1fff7" stroke-width="4.5"/>
  </g>
</g>
<rect x="1" y="1" width="918" height="268" rx="23" fill="none" stroke="#334362" stroke-width="2"/>

</svg>
