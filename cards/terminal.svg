<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 152" role="img" aria-labelledby="terminal-title">
  <title id="terminal-title">AI Meeting Assistant Pipeline Preview</title>

  <style>
    .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  </style>

  <!-- Shell surface and quiet hairline -->
  <rect x="0.5" y="0.5" width="919" height="151" rx="14" fill="#16171a" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

  <!-- Top bar -->
  <line x1="0" y1="36" x2="920" y2="36" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
  <circle cx="24" cy="18" r="4" fill="#2c2e35"/>
  <circle cx="38" cy="18" r="4" fill="#2c2e35"/>
  <circle cx="52" cy="18" r="4" fill="#2c2e35"/>
  <text x="72" y="22" class="mono" font-size="11" fill="#737373">meeting-assistant · python 3.11</text>

  <!-- Command Line Session -->
  <g transform="translate(24, 66)" class="mono" font-size="13">
    <!-- Prompt & Command -->
    <text x="0" y="0" fill="#3eb4a2">$</text>
    <text x="16" y="0" fill="#ededed">python -m meeting_assistant --audio discussion.wav --ground-truth-check</text>

    <!-- Output lines -->
    <text x="16" y="26" fill="#a1a1a6">Transcribed with Faster-Whisper · 42m audio in 8.4s</text>
    <text x="16" y="50" fill="#737373">Generated 14 action items, 4 decisions · Verified against transcript context</text>
  </g>
</svg>
