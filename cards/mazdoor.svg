<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 160" role="img" aria-labelledby="title-mazdoor">
  <title id="title-mazdoor">Mazdoor Evidence Kit</title>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  </style>

  <!-- Card Surface and Hairline -->
  <rect x="0.5" y="0.5" width="449" height="159" rx="12" fill="#16171a" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

  <!-- Left Content -->
  <g transform="translate(28, 30)">
    <text x="0" y="0" class="mono" font-size="12" font-weight="400" fill="#52b788">Worker tools</text>
    <text x="0" y="30" class="sans" font-size="20" font-weight="500" fill="#ededed" letter-spacing="-0.3">Mazdoor Evidence Kit</text>
    <text x="0" y="54" class="sans" font-size="13.5" font-weight="400" fill="#a1a1a6">Work logs and payment records</text>
    <text x="0" y="82" class="mono" font-size="11.5" font-weight="400" fill="#737373">Offline-first · Tamper-evident ledger</text>
  </g>

  <!-- Right Visual Moment: Clean Wage Ledger Slip -->
  <g transform="translate(298, 24)">
    <rect x="0" y="0" width="124" height="112" rx="8" fill="#1b1c20" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
    
    <!-- Ledger Sheet -->
    <rect x="14" y="14" width="96" height="84" rx="4" fill="#141917" stroke="#253830" stroke-width="1"/>
    
    <!-- Shift Log Rows -->
    <g class="mono" font-size="8.5">
      <!-- Row 1 -->
      <text x="22" y="32" fill="#a1a1a6">Shift 08h</text>
      <text x="100" y="32" text-anchor="end" fill="#52b788">₹650</text>
      <line x1="22" y1="38" x2="100" y2="38" stroke="#1c2d26" stroke-width="0.75"/>

      <!-- Row 2 -->
      <text x="22" y="52" fill="#a1a1a6">Shift 08h</text>
      <text x="100" y="52" text-anchor="end" fill="#52b788">₹650</text>
      <line x1="22" y1="58" x2="100" y2="58" stroke="#1c2d26" stroke-width="0.75"/>

      <!-- Row 3 -->
      <text x="22" y="72" fill="#a1a1a6">OT 02h</text>
      <text x="100" y="72" text-anchor="end" fill="#52b788">₹200</text>
      <line x1="22" y1="78" x2="100" y2="78" stroke="#2a4539" stroke-width="0.75"/>

      <!-- Total -->
      <text x="22" y="90" fill="#737373">Verified</text>
      <text x="100" y="90" text-anchor="end" font-weight="500" fill="#ededed">₹1,500</text>
    </g>
  </g>
</svg>
